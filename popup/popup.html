<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Nope</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Nope</h1>

  <fieldset id="display-mode-group" class="cb-display-mode">
    <legend>ブロック済みの表示</legend>
    <label><input type="radio" name="display-mode" value="placeholder" id="mode-placeholder"> ブロック表示に置き換え</label>
    <label><input type="radio" name="display-mode" value="collapse" id="mode-collapse"> 非表示にして詰める</label>
  </fieldset>

  <section class="cb-section">
    <p class="cb-label">BLOCKED</p>
    <div id="blocked-list"></div>
  </section>

  <section class="cb-section">
    <p class="cb-label">KEYWORD BLOCK</p>
    <div class="cb-keyword-header">
      <select id="keyword-site">
        <option value="yahoo_news">Yahoo ニュース</option>
        <option value="yahoo_japan">Yahoo! JAPAN</option>
      </select>
    </div>
    <form id="keyword-form" class="cb-keyword-form">
      <input type="text" id="keyword-input" placeholder="キーワード" required>
      <button type="submit">追加</button>
    </form>
    <p id="keyword-status" class="cb-status"></p>
    <ul id="keyword-list" class="cb-keyword-list"></ul>
  </section>

  <button type="button" id="clear-cache">キャッシュクリア</button>

  <footer class="cb-footer">
    <a href="https://kitepon.dev" target="_blank" rel="noopener" class="cb-footer-link">kitepon.dev</a>
  </footer>

  <script src="../src/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
